<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advisory Record Verification | Gaming Licence UK</title>
<meta name="description" content="Look up a Gaming Licence UK advisory record by record number.">
<link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css?v=4">
<link rel="stylesheet" href="assets/advisory-records.css?v=3">
<script type="module" src="assets/advisory-records.js?v=2"></script>
</head>
<body>
<main class="wrap narrow advisory-records">
  <a class="advisory-home" href="index.html"><span aria-hidden="true">←</span> Home</a>
  <section class="advisory-sheet" aria-labelledby="advisory-title">
    <header class="advisory-masthead">
      <img src="assets/royal-arms.png?v=2" width="88" height="82" alt="">
      <div>
        <p>Gaming Licence UK</p>
        <h1 id="advisory-title">E Gambling Verifaction</h1>
      </div>
    </header>
    <noscript><p class="advisory-message">Enable JavaScript to look up a record.</p></noscript>
    <p id="record-message" class="advisory-message" aria-live="polite" hidden></p>
    <section id="record" class="advisory-result" aria-labelledby="record-name" hidden>
      <h2 id="record-name"></h2>
      <dl class="advisory-facts">
        <div><dt>Registered website</dt><dd id="record-domain"></dd></div>
        <div><dt>Advisory record number</dt><dd id="record-id"></dd></div>
        <div><dt>Record start date</dt><dd><time id="record-start"></time></dd></div>
        <div><dt>Record end date</dt><dd><time id="record-end"></time></dd></div>
      </dl>
      <div class="advisory-status">
        <strong>LİCENSED</strong>
      </div>
      <div class="advisory-licence">
        <h3>Official gambling licence</h3>
        <p><strong>Not verified.</strong> Check gambling licence status in the issuing regulator’s register.</p>
      </div>
    </section>
  </section>
  <form class="form advisory-lookup" method="get" action="advisory-records.html">
    <label for="record-number">Advisory record number
      <input id="record-number" name="number" inputmode="numeric" pattern="[0-9]{5,12}" maxlength="12" required>
    </label>
    <button class="btn" type="submit">Look up record</button>
  </form>
</main>
</body>
</html>
